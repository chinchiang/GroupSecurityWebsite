version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # `next` and `eslint-config-next` are released in lockstep from the same
    # monorepo; bump them in one PR so neither lands out of step with the other.
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      # react-dom exact-pins its matching react (peer `react@^<same version>`),
      # so a split pair is unmergeable: the react-dom half fails `npm ci` on the
      # peer conflict and the react half fails the tests. Bump them together.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
